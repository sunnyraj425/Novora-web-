# ==============================================================================
# NOVORA DIGITAL - Netlify Production Deployment Configuration
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist"

# Environment configuration defaults
[build.environment]
  NODE_VERSION = "20"

# SPA Fallback Routing
# Ensures clean paths (e.g. /admin, /category/ai, /product/:id, /checkout)
# resolve correctly to /index.html with HTTP 200 without Netlify 404 errors.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Policy Headers for Storefront Protection
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache immutable hashed static assets generated by Vite
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Index file revalidation to ensure instant updates upon new deployments
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
