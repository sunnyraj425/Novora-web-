<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" width="100%" height="100%">
  <defs>
    <!-- Specular Metallic Gradients matching official NOVORA DIGITAL asset -->
    <linearGradient id="cyberHexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FE" />
      <stop offset="25%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="75%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="cyberHexInner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="40%" stop-color="#0EA5E9" />
      <stop offset="80%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- 3D Monogram N - Left Stem Facet -->
    <linearGradient id="nLeftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- 3D Monogram N - Main Diagonal Front Face -->
    <linearGradient id="nDiagFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="20%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#0284C7" />
      <stop offset="85%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>

    <!-- 3D Monogram N - Bevel Depth / Shadow -->
    <linearGradient id="nBevelShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="50%" stop-color="#075985" />
      <stop offset="100%" stop-color="#082F49" />
    </linearGradient>

    <!-- 3D Monogram N - Right Stem -->
    <linearGradient id="nRightStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="40%" stop-color="#7DD3FC" />
      <stop offset="80%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Pixel dispersion blocks -->
    <linearGradient id="pixelGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="pixelGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Typography Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="25%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="75%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.35" />
    </filter>
  </defs>

  <g id="official-novora-digital-logo" filter="url(#cyberGlow)">
    <!-- ========================================================= -->
    <!-- 1. DISPERSING DIGITAL PIXEL CUBES (TOP RIGHT)            -->
    <!-- ========================================================= -->
    <g id="pixel-dispersion">
      <!-- Outer small particles -->
      <rect x="525" y="235" width="10" height="10" rx="1.5" fill="url(#pixelGrad1)" opacity="0.95" />
      <rect x="548" y="248" width="8" height="8" rx="1" fill="url(#pixelGrad1)" opacity="0.9" />
      <rect x="505" y="255" width="12" height="12" rx="2" fill="url(#pixelGrad2)" opacity="0.85" />
      <rect x="528" y="260" width="14" height="14" rx="2" fill="url(#pixelGrad1)" opacity="0.95" />
      <rect x="552" y="265" width="9" height="9" rx="1.5" fill="url(#pixelGrad2)" opacity="0.8" />
      <rect x="500" y="278" width="11" height="11" rx="1.5" fill="url(#pixelGrad1)" opacity="0.85" />
      
      <!-- Middle dense pixel cluster -->
      <rect x="472" y="248" width="13" height="13" rx="2" fill="url(#pixelGrad2)" opacity="0.9" />
      <rect x="490" y="240" width="9" height="9" rx="1" fill="url(#pixelGrad1)" opacity="0.9" />
      <rect x="456" y="266" width="15" height="15" rx="2" fill="url(#pixelGrad1)" opacity="0.95" />
      <rect x="476" y="270" width="18" height="18" rx="2" fill="url(#pixelGrad2)" opacity="0.95" />
      <rect x="500" y="296" width="14" height="14" rx="2" fill="url(#pixelGrad1)" opacity="0.9" />
      <rect x="520" y="285" width="12" height="12" rx="2" fill="url(#pixelGrad2)" opacity="0.85" />
      <rect x="536" y="302" width="10" height="10" rx="1.5" fill="url(#pixelGrad1)" opacity="0.8" />

      <!-- Lower right dispersion cluster -->
      <rect x="460" y="295" width="14" height="14" rx="2" fill="url(#pixelGrad2)" opacity="0.9" />
      <rect x="480" y="306" width="13" height="13" rx="2" fill="url(#pixelGrad1)" opacity="0.95" />
      <rect x="468" y="328" width="11" height="11" rx="1.5" fill="url(#pixelGrad2)" opacity="0.85" />
      <rect x="495" y="322" width="15" height="15" rx="2" fill="url(#pixelGrad1)" opacity="0.9" />
      <rect x="514" y="328" width="8" height="8" rx="1" fill="url(#pixelGrad2)" opacity="0.8" />
      <rect x="490" y="348" width="12" height="12" rx="2" fill="url(#pixelGrad1)" opacity="0.9" />
      <rect x="506" y="360" width="9" height="9" rx="1.5" fill="url(#pixelGrad2)" opacity="0.85" />
    </g>

    <!-- ========================================================= -->
    <!-- 2. CYBER GEOMETRIC HEXAGON FRAME                          -->
    <!-- ========================================================= -->
    <!-- Outer Hexagon Path -->
    <path
      d="M 400,230 L 480,276 L 480,390 L 495,435 L 400,490 L 305,435 L 305,285 Z"
      fill="none"
      stroke="url(#cyberHexGrad)"
      stroke-width="11"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Inner Hexagon Accent Track -->
    <path
      d="M 400,248 L 466,286 L 466,380 L 480,424 L 400,470 L 320,424 L 320,296 Z"
      fill="none"
      stroke="url(#cyberHexInner)"
      stroke-width="5"
      stroke-linejoin="round"
      stroke-linecap="round"
      opacity="0.85"
    />

    <!-- Outer fine secondary facet line -->
    <path
      d="M 390,222 L 295,277 L 295,443 L 400,504 L 505,443"
      fill="none"
      stroke="#BAE6FD"
      stroke-width="3"
      stroke-linejoin="round"
      stroke-linecap="round"
      opacity="0.6"
    />

    <!-- ========================================================= -->
    <!-- 3. DIMENSIONAL 3D MONOGRAM "N"                           -->
    <!-- ========================================================= -->
    <!-- Left Vertical Leg Front Face -->
    <path
      d="M 345,282 L 378,282 L 378,438 L 345,438 Z"
      fill="url(#nLeftFacet)"
    />

    <!-- Left Leg Bottom Bevel Hook (anchoring to hexagon) -->
    <polygon
      points="345,438 378,438 350,455 328,442"
      fill="url(#nBevelShadow)"
    />

    <!-- Diagonal 3D Extrusion Depth/Under-Shadow -->
    <polygon
      points="345,282 378,282 462,438 430,438"
      fill="url(#nBevelShadow)"
      opacity="0.95"
    />

    <!-- Main Diagonal Foreground Crossbar -->
    <polygon
      points="345,282 388,282 462,416 430,416"
      fill="url(#nDiagFace)"
    />

    <!-- Diagonal Upper Specular Rim Line -->
    <line
      x1="345" y1="282"
      x2="462" y2="416"
      stroke="#FFFFFF"
      stroke-width="3.5"
      stroke-linecap="round"
    />

    <!-- Right Vertical Leg Front Face -->
    <path
      d="M 430,282 L 462,282 L 462,438 L 430,438 Z"
      fill="url(#nRightStem)"
    />

    <!-- Right Leg Top Highlight -->
    <line
      x1="430" y1="282"
      x2="462" y2="282"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
    />

    <!-- ========================================================= -->
    <!-- 4. "NOVORA" DISPLAY LOGOTYPE                              -->
    <!-- ========================================================= -->
    <g id="novora-text" fill="url(#textGrad)">
      <text
        x="400"
        y="585"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="64"
        font-weight="800"
        letter-spacing="10"
        text-anchor="middle"
      >
        NOVORA
      </text>
    </g>

    <!-- ========================================================= -->
    <!-- 5. "— DIGITAL —" SUBTITLE & HORIZONTAL ACCENT LINES       -->
    <!-- ========================================================= -->
    <g id="digital-subtitle">
      <!-- Left hairline -->
      <line
        x1="210" y1="628"
        x2="285" y2="628"
        stroke="url(#textGrad)"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.9"
      />

      <!-- Subtitle Text -->
      <text
        x="400"
        y="635"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="21"
        font-weight="600"
        letter-spacing="14"
        text-anchor="middle"
        fill="url(#textGrad)"
      >
        DIGITAL
      </text>

      <!-- Right hairline -->
      <line
        x1="515" y1="628"
        x2="590" y2="628"
        stroke="url(#textGrad)"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.9"
      />
    </g>
  </g>
</svg>
